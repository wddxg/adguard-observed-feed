name: 每周更新拦截列表

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

concurrency:
  group: weekly-filter-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 重新生成订阅
        run: python build_filter.py

      - name: 提交变化
        shell: bash
        run: |
          git add dist/adguard-home.txt dist/build-report.json
          if git diff --cached --quiet; then
            echo "订阅没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "每周更新拦截列表"
          git push
